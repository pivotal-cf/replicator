version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  groups:
    security-fixes:
      applies-to: security-updates
      patterns: ["*"]
    routine-updates:
      applies-to: version-updates
      patterns: ["*"]

- package-ecosystem: "gomod"
  directory: "/"
  schedule:
    interval: "weekly"
  groups:
    security-fixes:
      applies-to: security-updates
      patterns: ["*"]
    routine-updates:
      applies-to: version-updates
      patterns: ["*"]
